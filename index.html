      body {
        font-family: 'Inter', sans-serif;
        background-color: #0b0f19; /* Deeper Slate/Black */
        color: #e2e8f0; /* Slate 200 */
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        /* Light Blue -> Purple -> Gold Gradient */
        background: linear-gradient(to bottom, #38bdf8, #a855f7, #fbbf24); 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(to bottom, #7dd3fc, #c084fc, #fcd34d); 
      }
    </style>
